name: Build and Release Packages

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # LINUX
  # ============================================================

  linux:
    name: Linux ${{ matrix.arch }}

    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # ----------------------------------------------------
          # x86_64
          # ----------------------------------------------------

          - arch: x86_64
            runner: ubuntu-24.04

            appimage_tool: linuxdeploy-x86_64.AppImage

            appimage_name: CppDevOpsDemo-linux-x86_64.AppImage
            deb_name: CppDevOpsDemo-linux-x86_64.deb
            rpm_name: CppDevOpsDemo-linux-x86_64.rpm

          # ----------------------------------------------------
          # ARM64
          # ----------------------------------------------------

          - arch: arm64
            runner: ubuntu-24.04-arm

            appimage_tool: linuxdeploy-aarch64.AppImage

            appimage_name: CppDevOpsDemo-linux-arm64.AppImage
            deb_name: CppDevOpsDemo-linux-arm64.deb
            rpm_name: CppDevOpsDemo-linux-arm64.rpm


    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # SYSTEM INFORMATION
      # ========================================================

      - name: Show system information
        run: |
          echo "=========================================="
          echo "System"
          echo "=========================================="

          uname -a

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "CMake:"
          cmake --version

          echo
          echo "Compiler:"
          g++ --version


      # ========================================================
      # INSTALL LINUX PACKAGING DEPENDENCIES
      # ========================================================

      - name: Install packaging dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            dpkg-dev \
            rpm \
            file \
            wget \
            curl \
            fuse3

          echo
          echo "=========================================="
          echo "Packaging tools"
          echo "=========================================="

          which dpkg-deb
          which rpm
          which rpmbuild || true

          echo
          echo "RPM:"
          rpm --version || true

          echo
          echo "rpmbuild:"
          rpmbuild --version || true


      # ========================================================
      # HARD FAIL IF RPM BUILD TOOL IS MISSING
      # ========================================================

      - name: Verify RPM build environment
        run: |
          if ! command -v rpmbuild >/dev/null 2>&1; then
            echo "ERROR: rpmbuild is not available."
            echo
            echo "Installed RPM tools:"
            dpkg -l | grep -E '^ii.*rpm' || true
            exit 1
          fi

          echo "rpmbuild is available:"
          rpmbuild --version


      # ========================================================
      # CONFIGURE
      # ========================================================

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release


      # ========================================================
      # SHOW CMAKE TARGET ARCHITECTURE
      # ========================================================

      - name: Show CMake architecture
        run: |
          echo "=========================================="
          echo "CMake architecture"
          echo "=========================================="

          grep \
            -E "CMAKE_SYSTEM_NAME|CMAKE_SYSTEM_PROCESSOR|CMAKE_CXX_COMPILER" \
            build/CMakeCache.txt || true


      # ========================================================
      # BUILD
      # ========================================================

      - name: Build application
        run: |
          cmake \
            --build build \
            --config Release \
            --parallel


      # ========================================================
      # VERIFY EXECUTABLE
      # ========================================================

      - name: Verify executable
        run: |
          echo "=========================================="
          echo "Executable"
          echo "=========================================="

          if [ ! -f build/app ]; then
            echo "ERROR: build/app was not generated."
            exit 1
          fi

          file build/app

          echo
          echo "Runner:"
          uname -m


      # ========================================================
      # PREPARE DIST
      # ========================================================

      - name: Prepare distribution directory
        run: |
          rm -rf dist
          mkdir -p dist


      # ========================================================
      # DEB
      # ========================================================

      - name: Build DEB
        run: |
          cd build

          cpack \
            -G DEB \
            -B ../dist

      - name: Rename DEB
        run: |
          DEB_FILE=$(find dist \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: No DEB package was generated."
            exit 1
          fi

          mv \
            "$DEB_FILE" \
            "dist/${{ matrix.deb_name }}"


      # ========================================================
      # RPM
      # ========================================================

      - name: Build RPM
        run: |
          cd build

          cpack \
            -G RPM \
            -B ../dist

      - name: Rename RPM
        run: |
          RPM_FILE=$(find dist \
            -maxdepth 1 \
            -type f \
            -name "*.rpm" \
            | head -n 1)

          if [ -z "$RPM_FILE" ]; then
            echo "ERROR: No RPM package was generated."
            exit 1
          fi

          mv \
            "$RPM_FILE" \
            "dist/${{ matrix.rpm_name }}"


      # ========================================================
      # DOWNLOAD LINUXDEPLOY
      # ========================================================


      - name: Download linuxdeploy
        run: |
          echo "Downloading:"
          echo "${{ matrix.appimage_tool }}"

          URL="https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/${{ matrix.appimage_tool }}"

          curl \
            -L \
            --fail \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            -o linuxdeploy.AppImage \
            "$URL"

          if [ ! -s linuxdeploy.AppImage ]; then
            echo "ERROR: linuxdeploy download is empty."
            exit 1
          fi

          chmod +x linuxdeploy.AppImage

          echo
          echo "Downloaded file:"
          ls -lh linuxdeploy.AppImage

          echo
          echo "File type:"
          file linuxdeploy.AppImage
      # ========================================================
      # CREATE APPDIR
      # ========================================================

      - name: Create AppDir
        run: |
          rm -rf AppDir

          mkdir -p \
            AppDir/usr/bin \
            AppDir/usr/share/applications

          cp \
            build/app \
            AppDir/usr/bin/app

          chmod +x \
            AppDir/usr/bin/app

      # ========================================================
      # CREATE APPIMAGE ICON
      # ========================================================

      - name: Create AppImage icon
        run: |
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Create a simple valid PNG icon.
          # Uses ImageMagick if available.
          if command -v convert >/dev/null 2>&1; then
            convert \
              -size 256x256 \
              xc:blue \
              AppDir/usr/share/icons/hicolor/256x256/apps/CppDevOpsDemo.png
          else
            echo "ImageMagick not available, installing it..."
            sudo apt-get update
            sudo apt-get install -y imagemagick

            convert \
              -size 256x256 \
              xc:blue \
              AppDir/usr/share/icons/hicolor/256x256/apps/CppDevOpsDemo.png
          fi

          file \
            AppDir/usr/share/icons/hicolor/256x256/apps/CppDevOpsDemo.png


      # ========================================================
      # CREATE DESKTOP ENTRY
      # ========================================================

      - name: Create desktop entry
        run: |
          cat > AppDir/usr/share/applications/CppDevOpsDemo.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=CppDevOpsDemo
          Comment=Automated Cross-Platform C++ Application
          Exec=app
          Icon=CppDevOpsDemo
          Terminal=true
          Categories=Utility;
          EOF

          cp \
            AppDir/usr/share/applications/CppDevOpsDemo.desktop \
            AppDir/CppDevOpsDemo.desktop

          echo "Desktop entry:"
          cat AppDir/CppDevOpsDemo.desktop


      # ========================================================
      # BUILD APPIMAGE
      # ========================================================

      - name: Build AppImage
        env:
          NO_STRIP: "1"
        run: |
          ./linuxdeploy.AppImage \
            --appimage-extract-and-run \
            --appdir AppDir \
            --output appimage


      # ========================================================
      # RENAME APPIMAGE
      # ========================================================

      - name: Rename AppImage
        run: |
          APPIMAGE_FILE=$(find . \
            -maxdepth 1 \
            -type f \
            -name "*.AppImage" \
            ! -name "linuxdeploy.AppImage" \
            | head -n 1)

          if [ -z "$APPIMAGE_FILE" ]; then
            echo "ERROR: AppImage was not generated."
            exit 1
          fi

          mv \
            "$APPIMAGE_FILE" \
            "dist/${{ matrix.appimage_name }}"

          chmod +x \
            "dist/${{ matrix.appimage_name }}"

          echo "AppImage created:"
          ls -lh "dist/${{ matrix.appimage_name }}"


      # ========================================================
      # FIND APPIMAGE
      # ========================================================

      - name: Rename AppImage
        run: |
          APPIMAGE_FILE=$(find . \
            -maxdepth 1 \
            -type f \
            -name "*.AppImage" \
            ! -name "linuxdeploy.AppImage" \
            | head -n 1)

          if [ -z "$APPIMAGE_FILE" ]; then
            echo "ERROR: AppImage was not generated."
            exit 1
          fi

          mv \
            "$APPIMAGE_FILE" \
            "dist/${{ matrix.appimage_name }}"

          chmod +x \
            "dist/${{ matrix.appimage_name }}"


      # ========================================================
      # VERIFY ALL PACKAGES
      # ========================================================

      - name: Verify packages
        run: |
          echo
          echo "=========================================="
          echo "FINAL PACKAGES"
          echo "=========================================="

          ls -lh dist/

          echo
          echo "File information:"
          file dist/*

          echo
          echo "Package count:"

          COUNT=$(find dist \
            -maxdepth 1 \
            -type f \
            | wc -l)

          echo "$COUNT"

          if [ "$COUNT" -ne 3 ]; then
            echo "ERROR: Expected exactly 3 Linux packages."
            exit 1
          fi


      # ========================================================
      # UPLOAD
      # ========================================================

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4

        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error


  # ============================================================
  # WINDOWS
  # ============================================================

  windows:
    name: Windows x86_64

    runs-on: windows-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # SYSTEM INFORMATION
      # ========================================================

      - name: Show Windows environment
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Windows environment"
          Write-Host "=========================================="

          Write-Host "Architecture:"
          $env:PROCESSOR_ARCHITECTURE

          Write-Host ""
          Write-Host "CMake:"
          cmake --version


      # ========================================================
      # CHECK WIX
      # ========================================================

      - name: Check WiX
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "WiX"
          Write-Host "=========================================="

          $wix = Get-Command candle.exe -ErrorAction SilentlyContinue

          if ($wix) {
              Write-Host "WiX already available:"
              $wix.Source
          }
          else {
              Write-Host "WiX not found."
          }


      # ========================================================
      # INSTALL WIX 3.14
      # ========================================================

      - name: Install WiX Toolset
        shell: powershell
        run: |
          $wix = Get-Command candle.exe -ErrorAction SilentlyContinue

          if (-not $wix) {
              choco install wixtoolset `
                --version=3.14.1 `
                --no-progress `
                -y
          }

          Write-Host ""
          Write-Host "Searching for candle.exe..."

          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue

          if (-not $candle) {
              $paths = @(
                  "C:\Program Files (x86)\WiX Toolset v3.14\bin",
                  "C:\Program Files (x86)\WiX Toolset v3.11\bin"
              )

              foreach ($path in $paths) {
                  if (Test-Path "$path\candle.exe") {
                      $env:PATH = "$path;$env:PATH"
                      break
                  }
              }
          }

          candle.exe -?
          light.exe -?


      # ========================================================
      # CONFIGURE
      # ========================================================

      - name: Configure CMake
        shell: powershell
        run: |
          cmake `
            -S . `
            -B build `
            -DCMAKE_BUILD_TYPE=Release


      # ========================================================
      # BUILD
      # ========================================================

      - name: Build application
        shell: powershell
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel


      # ========================================================
      # VERIFY
      # ========================================================

      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path "build\Release\app.exe")) {
              Write-Error "ERROR: build\Release\app.exe was not generated."
              exit 1
          }

          Get-Item "build\Release\app.exe"


      # ========================================================
      # PREPARE DIST
      # ========================================================

      - name: Prepare distribution directory
        shell: powershell
        run: |
          Remove-Item `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue `
            dist

          New-Item `
            -ItemType Directory `
            -Force `
            dist


      # ========================================================
      # BUILD MSI
      # ========================================================

      - name: Build MSI
        shell: powershell
        run: |
          Push-Location build

          cpack `
            -G WIX `
            -C Release

          Pop-Location

          $msi = Get-ChildItem `
            "build\*.msi" |
            Select-Object -First 1

          if (-not $msi) {
              Write-Error "ERROR: MSI package was not generated."
              exit 1
          }

          Copy-Item `
            $msi.FullName `
            "dist\CppDevOpsDemo-windows-x86_64.msi"


      # ========================================================
      # VERIFY MSI
      # ========================================================

      - name: Verify MSI
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "MSI"
          Write-Host "=========================================="

          Get-ChildItem dist

          $count = (Get-ChildItem dist -File).Count

          if ($count -ne 1) {
              Write-Error "Expected exactly one MSI."
              exit 1
          }


      # ========================================================
      # UPLOAD
      # ========================================================

      - name: Upload Windows package
        uses: actions/upload-artifact@v4

        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error


  # ============================================================
  # RELEASE
  # ============================================================

  release:
    name: Publish GitHub Release

    needs:
      - linux
      - windows

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      # ========================================================
      # DOWNLOAD ARTIFACTS
      # ========================================================

      - name: Download all packages
        uses: actions/download-artifact@v4

        with:
          path: release-assets
          merge-multiple: true


      # ========================================================
      # VERIFY
      # ========================================================

      - name: Verify release assets
        run: |
          echo "=========================================="
          echo "RELEASE ASSETS"
          echo "=========================================="

          find release-assets \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

          echo
          echo "Package count:"

          COUNT=$(find release-assets \
            -maxdepth 1 \
            -type f \
            | wc -l)

          echo "$COUNT"

          if [ "$COUNT" -ne 7 ]; then
            echo
            echo "ERROR: Expected exactly 7 release packages."
            echo
            echo "Expected:"
            echo "  3 x Linux x86_64"
            echo "  3 x Linux ARM64"
            echo "  1 x Windows x86_64"
            exit 1
          fi


      # ========================================================
      # CREATE RELEASE
      # ========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:
          generate_release_notes: true

          files: |
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.msi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
