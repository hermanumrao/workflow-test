name: Build and Release Packages

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write


jobs:

  # ============================================================
  # LINUX
  # ============================================================

  linux:
    name: Linux ${{ matrix.arch }}

    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # ----------------------------------------------------
          # x86_64
          # ----------------------------------------------------

          - arch: x86_64
            runner: ubuntu-24.04

            linuxdeploy: linuxdeploy-x86_64.AppImage

            appimage_name: CppDevOpsDemo-linux-x86_64.AppImage
            deb_name: CppDevOpsDemo-linux-x86_64.deb
            rpm_name: CppDevOpsDemo-linux-x86_64.rpm


          # ----------------------------------------------------
          # ARM64
          # ----------------------------------------------------

          - arch: arm64
            runner: ubuntu-24.04-arm

            linuxdeploy: linuxdeploy-aarch64.AppImage

            appimage_name: CppDevOpsDemo-linux-arm64.AppImage
            deb_name: CppDevOpsDemo-linux-arm64.deb
            rpm_name: CppDevOpsDemo-linux-arm64.rpm


    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # SYSTEM INFORMATION
      # ========================================================

      - name: Show system information
        run: |
          echo "=========================================="
          echo "SYSTEM"
          echo "=========================================="

          uname -a

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "CMake:"
          cmake --version

          echo
          echo "Compiler:"
          g++ --version


      # ========================================================
      # INSTALL DEPENDENCIES
      # ========================================================

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            dpkg-dev \
            rpm \
            file \
            curl \
            fuse3 \
            libfuse2t64 \
            imagemagick \
            squashfs-tools \
            binutils

          echo
          echo "=========================================="
          echo "PACKAGING TOOLS"
          echo "=========================================="

          echo "dpkg-deb:"
          dpkg-deb --version | head -n 1

          echo
          echo "rpm:"
          rpm --version

          echo
          echo "rpmbuild:"
          rpmbuild --version

          echo
          echo "ImageMagick:"
          convert --version | head -n 1

          echo
          echo "FUSE:"
          ldconfig -p | grep libfuse || true


      # ========================================================
      # VERIFY RPM
      # ========================================================

      - name: Verify RPM build environment
        run: |
          if ! command -v rpmbuild >/dev/null 2>&1; then
            echo "ERROR: rpmbuild is not available."
            exit 1
          fi

          echo "rpmbuild:"
          rpmbuild --version


      # ========================================================
      # CONFIGURE
      # ========================================================

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release


      # ========================================================
      # SHOW CMAKE ARCHITECTURE
      # ========================================================

      - name: Show CMake architecture
        run: |
          echo "=========================================="
          echo "CMAKE"
          echo "=========================================="

          grep \
            -E "CMAKE_SYSTEM_NAME|CMAKE_SYSTEM_PROCESSOR|CMAKE_CXX_COMPILER" \
            build/CMakeCache.txt || true


      # ========================================================
      # BUILD
      # ========================================================

      - name: Build application
        run: |
          cmake \
            --build build \
            --config Release \
            --parallel


      # ========================================================
      # VERIFY EXECUTABLE
      # ========================================================

      - name: Verify executable
        run: |
          echo "=========================================="
          echo "EXECUTABLE"
          echo "=========================================="

          if [ ! -f build/app ]; then
            echo "ERROR: build/app was not generated."
            exit 1
          fi

          file build/app

          echo
          echo "Runner architecture:"
          uname -m


      # ========================================================
      # PREPARE DIST
      # ========================================================

      - name: Prepare distribution directory
        run: |
          rm -rf dist
          mkdir -p dist


      # ========================================================
      # DEB
      # ========================================================

      - name: Build DEB
        run: |
          cd build

          cpack \
            -G DEB \
            -B ../dist


      - name: Rename DEB
        run: |
          DEB_FILE=$(find dist \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: DEB package was not generated."
            exit 1
          fi

          mv \
            "$DEB_FILE" \
            "dist/${{ matrix.deb_name }}"


      # ========================================================
      # RPM
      # ========================================================

      - name: Build RPM
        run: |
          cd build

          cpack \
            -G RPM \
            -B ../dist


      - name: Rename RPM
        run: |
          RPM_FILE=$(find dist \
            -maxdepth 1 \
            -type f \
            -name "*.rpm" \
            | head -n 1)

          if [ -z "$RPM_FILE" ]; then
            echo "ERROR: RPM package was not generated."
            exit 1
          fi

          mv \
            "$RPM_FILE" \
            "dist/${{ matrix.rpm_name }}"


      # ========================================================
      # DOWNLOAD LINUXDEPLOY
      # ========================================================

      - name: Download linuxdeploy
        run: |
          URL="https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/${{ matrix.appimage_tool }}"

          echo "========================================"
          echo "ARCH: ${{ matrix.arch }}"
          echo "APPIMAGE TOOL: ${{ matrix.appimage_tool }}"
          echo "DOWNLOAD URL: $URL"
          echo "OUTPUT FILE: linuxdeploy.AppImage"
          echo "========================================"

          curl -L --fail --show-error --retry 3 --retry-delay 2 \
            -o linuxdeploy.AppImage \
            "$URL"

          chmod +x linuxdeploy.AppImage

          echo "Downloaded files:"
          find . -maxdepth 2 -type f -print

            # ========================================================
            # VERIFY LINUXDEPLOY ARCHITECTURE
            # ========================================================

            - name: Verify linuxdeploy architecture
              run: |
                MACHINE=$(uname -m)

                echo "Runner:"
                echo "$MACHINE"

                echo
                echo "linuxdeploy:"
                file linuxdeploy.AppImage

                if [ "$MACHINE" = "x86_64" ]; then

                  if ! file linuxdeploy.AppImage | grep -qi "x86-64"; then
                    echo "ERROR: linuxdeploy is not an x86_64 binary."
                    exit 1
                  fi

                elif [ "$MACHINE" = "aarch64" ]; then

                  if ! file linuxdeploy.AppImage | grep -qi "ARM aarch64"; then
                    echo "ERROR: linuxdeploy is not an ARM64 binary."
                    exit 1
                  fi

                else
                  echo "ERROR: Unsupported architecture:"
                  echo "$MACHINE"
                  exit 1
                fi


      # ========================================================
      # VERIFY LINUXDEPLOY RUNTIME
      # ========================================================

      - name: Verify linuxdeploy runtime
        run: |
          echo "=========================================="
          echo "TESTING LINUXDEPLOY"
          echo "=========================================="

          echo
          echo "Dynamic dependencies:"
          ldd ./linuxdeploy.AppImage || true

          echo
          echo "AppImage runtime:"
          ./linuxdeploy.AppImage \
            --appimage-extract-and-run \
            --version


      # ========================================================
      # CREATE APPDIR
      # ========================================================

      - name: Create AppDir
        run: |
          echo "=========================================="
          echo "APPDIR"
          echo "=========================================="

          rm -rf AppDir

          mkdir -p \
            AppDir/usr/bin \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/16x16/apps \
            AppDir/usr/share/icons/hicolor/32x32/apps \
            AppDir/usr/share/icons/hicolor/64x64/apps \
            AppDir/usr/share/icons/hicolor/128x128/apps \
            AppDir/usr/share/icons/hicolor/256x256/apps

          cp \
            build/app \
            AppDir/usr/bin/app

          chmod +x \
            AppDir/usr/bin/app

          echo "Application:"
          file AppDir/usr/bin/app


      # ========================================================
      # INSTALL REAL APPLICATION LOGO
      # ========================================================

      - name: Install application icon
        run: |
          echo "=========================================="
          echo "APPLICATION ICON"
          echo "=========================================="

          LOGO="assets/logo/test_logo.png"

          if [ ! -f "$LOGO" ]; then
            echo "ERROR: Logo not found:"
            echo "$LOGO"
            exit 1
          fi

          echo "Source logo:"
          file "$LOGO"

          for SIZE in 16 32 64 128 256; do

            convert \
              "$LOGO" \
              -background none \
              -resize "${SIZE}x${SIZE}" \
              -gravity center \
              -extent "${SIZE}x${SIZE}" \
              "AppDir/usr/share/icons/hicolor/${SIZE}x${SIZE}/apps/CppDevOpsDemo.png"

          done

          echo
          echo "Generated icons:"

          find AppDir/usr/share/icons \
            -type f \
            -name "CppDevOpsDemo.png" \
            -exec file {} \;


      # ========================================================
      # CREATE DESKTOP ENTRY
      # ========================================================

      - name: Create desktop entry
        run: |
          cat > AppDir/usr/share/applications/CppDevOpsDemo.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=CppDevOpsDemo
          GenericName=C++ Development Demo
          Comment=Automated Cross-Platform C++ Application
          Exec=app
          Icon=CppDevOpsDemo
          Terminal=true
          Categories=Development;Utility;
          EOF

          cp \
            AppDir/usr/share/applications/CppDevOpsDemo.desktop \
            AppDir/CppDevOpsDemo.desktop

          echo "Desktop file:"
          cat AppDir/CppDevOpsDemo.desktop


      # ========================================================
      # VERIFY APPDIR
      # ========================================================

      - name: Verify AppDir
        run: |
          echo "=========================================="
          echo "APPDIR CONTENTS"
          echo "=========================================="

          find AppDir \
            -maxdepth 6 \
            -type f \
            -print


      # ========================================================
      # BUILD APPIMAGE
      # ========================================================

      - name: Build AppImage
        env:
          NO_STRIP: "1"

        run: |
          echo "=========================================="
          echo "BUILDING APPIMAGE"
          echo "=========================================="

          rm -f ./*.AppImage

          ./linuxdeploy.AppImage \
            --appimage-extract-and-run \
            --appdir AppDir \
            --output appimage

          echo
          echo "linuxdeploy finished."

          echo
          echo "Generated AppImages:"

          find . \
            -type f \
            -iname "*.AppImage" \
            ! -name "linuxdeploy.AppImage" \
            -print


      # ========================================================
      # FIND AND RENAME APPIMAGE
      # ========================================================

      - name: Rename AppImage
        run: |
          echo "=========================================="
          echo "FINDING APPIMAGE"
          echo "=========================================="

          find . \
            -type f \
            -iname "*.AppImage" \
            -print

          APPIMAGE_FILE=$(find . \
            -type f \
            -iname "*.AppImage" \
            ! -name "linuxdeploy.AppImage" \
            ! -path "./linuxdeploy.AppImage" \
            | head -n 1)

          if [ -z "$APPIMAGE_FILE" ]; then
            echo
            echo "ERROR: AppImage was not generated."

            echo
            echo "AppDir contents:"
            find AppDir \
              -type f \
              -print || true

            exit 1
          fi

          echo
          echo "Found AppImage:"
          echo "$APPIMAGE_FILE"

          cp \
            "$APPIMAGE_FILE" \
            "dist/${{ matrix.appimage_name }}"

          chmod +x \
            "dist/${{ matrix.appimage_name }}"

          echo
          echo "Final AppImage:"
          ls -lh \
            "dist/${{ matrix.appimage_name }}"

          echo
          echo "File type:"
          file \
            "dist/${{ matrix.appimage_name }}"


      # ========================================================
      # VERIFY LINUX PACKAGES
      # ========================================================

      - name: Verify Linux packages
        run: |
          echo "=========================================="
          echo "FINAL LINUX PACKAGES"
          echo "=========================================="

          ls -lh dist/

          echo
          echo "File information:"
          file dist/*

          COUNT=$(find dist \
            -maxdepth 1 \
            -type f \
            | wc -l)

          echo
          echo "Package count: $COUNT"

          if [ "$COUNT" -ne 3 ]; then
            echo "ERROR: Expected exactly 3 Linux packages."
            exit 1
          fi


      # ========================================================
      # UPLOAD LINUX ARTIFACTS
      # ========================================================

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4

        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error


  # ============================================================
  # WINDOWS
  # ============================================================

  windows:
    name: Windows x86_64

    runs-on: windows-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # SYSTEM INFORMATION
      # ========================================================

      - name: Show Windows environment
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "WINDOWS"
          Write-Host "=========================================="

          Write-Host "Architecture:"
          Write-Host $env:PROCESSOR_ARCHITECTURE

          Write-Host ""
          Write-Host "CMake:"
          cmake --version


      # ========================================================
      # INSTALL WIX
      # ========================================================

      - name: Install WiX Toolset
        shell: powershell
        run: |
          $wix = Get-Command candle.exe -ErrorAction SilentlyContinue

          if (-not $wix) {

              choco install wixtoolset `
                --version=3.14.1 `
                --no-progress `
                -y
          }

          $paths = @(
              "C:\Program Files (x86)\WiX Toolset v3.14\bin",
              "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          )

          foreach ($path in $paths) {

              if (Test-Path "$path\candle.exe") {

                  $env:PATH = "$path;$env:PATH"

                  # Persist PATH for later GitHub Actions steps
                  Add-Content `
                    $env:GITHUB_PATH `
                    $path

                  break
              }
          }

          Write-Host ""
          Write-Host "WiX candle:"
          candle.exe -?

          Write-Host ""
          Write-Host "WiX light:"
          light.exe -?


      # ========================================================
      # CONFIGURE
      # ========================================================

      - name: Configure CMake
        shell: powershell
        run: |
          cmake `
            -S . `
            -B build `
            -DCMAKE_BUILD_TYPE=Release


      # ========================================================
      # BUILD
      # ========================================================

      - name: Build application
        shell: powershell
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel


      # ========================================================
      # VERIFY
      # ========================================================

      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path "build\Release\app.exe")) {

              Write-Error `
                "ERROR: build\Release\app.exe was not generated."

              exit 1
          }

          Get-Item `
            "build\Release\app.exe"


      # ========================================================
      # PREPARE DIST
      # ========================================================

      - name: Prepare distribution directory
        shell: powershell
        run: |
          Remove-Item `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue `
            dist

          New-Item `
            -ItemType Directory `
            -Force `
            dist


      # ========================================================
      # BUILD MSI
      # ========================================================

      - name: Build MSI
        shell: powershell
        run: |
          Push-Location build

          cpack `
            -G WIX `
            -C Release

          Pop-Location

          $msi = Get-ChildItem `
            "build\*.msi" |
            Select-Object -First 1

          if (-not $msi) {

              Write-Error `
                "ERROR: MSI package was not generated."

              exit 1
          }

          Copy-Item `
            $msi.FullName `
            "dist\CppDevOpsDemo-windows-x86_64.msi"


      # ========================================================
      # VERIFY MSI
      # ========================================================

      - name: Verify MSI
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "MSI"
          Write-Host "=========================================="

          Get-ChildItem dist

          $count = `
            (Get-ChildItem dist -File).Count

          if ($count -ne 1) {

              Write-Error `
                "Expected exactly one MSI."

              exit 1
          }


      # ========================================================
      # UPLOAD WINDOWS ARTIFACT
      # ========================================================

      - name: Upload Windows package
        uses: actions/upload-artifact@v4

        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: Publish GitHub Release

    needs:
      - linux
      - windows

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      # ========================================================
      # DOWNLOAD ALL ARTIFACTS
      # ========================================================

      - name: Download all packages
        uses: actions/download-artifact@v4

        with:
          path: release-assets
          merge-multiple: true


      # ========================================================
      # VERIFY RELEASE
      # ========================================================

      - name: Verify release assets
        run: |
          echo "=========================================="
          echo "RELEASE ASSETS"
          echo "=========================================="

          find release-assets \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

          COUNT=$(find release-assets \
            -maxdepth 1 \
            -type f \
            | wc -l)

          echo
          echo "Package count:"
          echo "$COUNT"

          if [ "$COUNT" -ne 7 ]; then

            echo
            echo "ERROR: Expected exactly 7 packages."

            echo
            echo "Expected:"
            echo "  3 x Linux x86_64"
            echo "  3 x Linux ARM64"
            echo "  1 x Windows x86_64"

            exit 1
          fi


      # ========================================================
      # CREATE GITHUB RELEASE
      # ========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:
          generate_release_notes: true

          files: |
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.msi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
